<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="appTitle">My Medical PWA (Personal Use)</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="description" data-i18n="appDescription" content="A personal web app for exploring symptom possibilities with an LLM. Not for professional medical use.">
    <link rel="icon" href="/icon-192x192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="/icon-192x192.png">
</head>
<body>
    <header>
        <h1 data-i18n="appHeader">Personal Medical Symptom Explorer</h1>
        <p class="disclaimer" data-i18n="disclaimerText">
            IMPORTANT: This app uses an AI and is for personal informational use ONLY.
        <div class="controls">
            <button id="theme-toggle" data-i18n="toggleTheme">Theme</button>
            <select id="language-selector">
                <option value="en">English</option>
                <option value="el">Ελληνικά</option>
                <option value="fr">Français</option>
            </select>
        </div>
    </header>

    <main>
        <section class="input-section">
        <h2 data-i18n="inputSectionTitle">Enter Symptoms & Observations</h2>
        <textarea id="symptoms-input" rows="10" placeholder="" data-i18n="symptomsPlaceholder"></textarea>

        <h2 data-i18n="imageInputTitle">Upload Patient Photo (Visible Symptoms)</h2>
        <input type="file" id="image-input" accept="image/png, image/jpeg, image/webp" data-i18n="imageInputLabel">
        <div id="image-preview-container" style="display: none;">
            <img id="image-preview" src="#" alt="Image Preview" style="max-width: 100%; height: auto; margin-top: 10px; border: 1px solid var(--border-color); border-radius: 5px;">
            <button id="clear-image-button" class="clear-button" data-i18n="clearImageButton">Clear Image</button>
        </div>

        <h2 data-i18n="cameraInputTitle">Or Take a Photo</h2>
        <button id="open-camera-button" data-i18n="openCameraButton">Open Camera</button>

        <div id="camera-container" style="display: none; text-align: center; margin-top: 15px;">
            <video id="camera-feed" autoplay playsinline style="width: 100%; max-width: 400px; border: 1px solid var(--border-color); border-radius: 5px;"></video>
            <button id="capture-photo-button" data-i18n="capturePhotoButton">Capture Photo</button>
            <button id="close-camera-button" class="clear-button" data-i18n="closeCameraButton">Close Camera</button>
            <canvas id="camera-canvas" style="display: none;"></canvas> </div>
        <button id="diagnose-button" data-i18n="diagnoseButton">Get AI Insights</button>
        <div id="loading-indicator" style="display: none;" data-i18n="loadingMessage">Generating insights...</div>
    </section>
    </main>

    <footer>
        <p data-i18n="footerText">&copy; 2025 Personal PWA. All rights reserved.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
